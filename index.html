<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>축구팀 주장 수첩</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F6B3F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주장 수첩">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0EA;--surface:#fff;--ink:#16231A;--muted:#5E6E62;--line:#D5DBD1;--turf:#2F6B3F;--on:#fff;--no:#B5472F;--accent:#E2B93B;--pitch:#2E7A43;--pl:rgba(255,255,255,.65);
--hd:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1712;--surface:#18231B;--ink:#E7EEE6;--muted:#97A89A;--line:#2A3A2E;--turf:#4E9A60;--on:#0C130E;--no:#E0735B;--pitch:#1F5A31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1712;--surface:#18231B;--ink:#E7EEE6;--muted:#97A89A;--line:#2A3A2E;--turf:#4E9A60;--on:#0C130E;--no:#E0735B;--pitch:#1F5A31;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 120px}
.team{display:block;width:100%;border:0;background:none;font:400 30px/1.2 var(--hd);padding:0;color:var(--ink)}
.sub{margin:2px 0 14px;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.in{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ta{min-height:180px;resize:none}
.stats{display:flex;gap:8px;margin-top:12px}
.stats div{flex:1;font-size:13px;color:var(--muted)}
.stats b{display:block;font:400 32px/1.1 var(--hd);color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.nm{font-weight:700;min-width:0}
.nm small,.pick small{margin-left:6px;font-weight:400;color:var(--muted);font-size:12px}
.seg{display:flex;gap:4px;flex-shrink:0}
.seg button{min-width:48px;min-height:40px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;font-size:13px}
.seg .y.on{background:var(--turf);color:var(--on);border-color:var(--turf)}
.seg .n.on{background:var(--no);color:#fff;border-color:var(--no)}
.seg .m.on{background:var(--muted);color:var(--surface);border-color:var(--muted)}
.btn{display:block;width:100%;min-height:46px;border:0;border-radius:12px;background:var(--turf);color:var(--on);font-weight:700;margin:0 0 12px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-weight:500}
.empty p{margin:0 0 12px;color:var(--muted)}
details summary{font-weight:700;cursor:pointer;min-height:28px}
.add{display:flex;gap:8px;margin:10px 0}
.add .btn{width:auto;padding:0 16px;margin:0}
.mrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.mrow .nm{flex:1}
.mrow select{width:84px;min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 6px}
.x{min-height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--no);font-size:13px}
.qt{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px}
.qt button{flex:1;min-width:58px;min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;color:var(--muted)}
.qt .on{background:var(--turf);color:var(--on);border-color:var(--turf)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:13px;color:var(--muted)}
.bar select{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 8px;font-weight:700;color:var(--ink)}
.pitch{position:relative;aspect-ratio:5/6;background:var(--pitch);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 12.5%,transparent 12.5% 25%);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--pl);margin:0 0 10px}
.pitch i{position:absolute;border:2px solid var(--pl);pointer-events:none}
.pitch .hl{left:0;right:0;top:50%;border-width:2px 0 0}
.pitch .cc{left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .bx{left:22%;right:22%;height:15%}
.pitch .bx.t{top:0;border-top:0}.pitch .bx.b{bottom:0;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0}
.chip{display:block;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:7px 7px 5px;border-radius:9px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:700;border-bottom:3px solid var(--gc,var(--line));box-shadow:0 1px 3px rgba(0,0,0,.3)}
.chip.e{background:rgba(255,255,255,.14);color:#fff;border:1.5px dashed rgba(255,255,255,.75);box-shadow:none;padding:7px}
.g-GK{--gc:#D9A91C}.g-DF{--gc:#3F7FD0}.g-MF{--gc:#3FA66A}.g-FW{--gc:#D9573B}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--gc)}
.bench{font-size:14px;margin:0 0 12px}.bench b{margin-right:6px}
.cfg{display:flex;gap:10px}.cfg label{flex:1;font-size:13px;color:var(--muted)}
.cfg .in{margin-top:4px;color:var(--ink)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;text-align:center;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:500}
td:first-child,th:first-child{text-align:left;padding-left:12px;font-weight:700}
td.off{color:var(--line)}
td.z{color:var(--no)}
.note{font-size:13px;color:var(--muted);margin:0 0 12px}.note.w{color:var(--no)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.nav button{flex:1;min-height:48px;background:none;border:0;border-radius:10px;font-weight:700;color:var(--muted)}
.nav .on{background:var(--turf);color:var(--on)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:78vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:21}
.sheet h3{margin:0 0 8px;font:400 20px var(--hd)}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:46px;padding:8px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font-weight:700}
.pick em{font-style:normal;font-weight:400;font-size:12px;color:var(--muted)}
.sheet .btn{margin:12px 0 0}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}
#toast.show{opacity:1}
.sub{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sort{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:13px;color:var(--muted)}
.sort select{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 8px;font-weight:700;color:var(--ink)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .nm{flex:1}.rec .nm small{display:block;margin:0}
.rec details{flex-basis:100%}.rec summary{font-size:13px;color:var(--muted);min-height:28px;font-weight:400}
.rec .note{margin:4px 0 0}
.sm{min-height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;color:var(--ink)}
.scr{display:flex;align-items:flex-end;justify-content:center;gap:12px}
.scr>div{text-align:center}
.step{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:400 22px var(--hd)}
.step b{min-width:34px;font:400 34px/1 var(--hd)}
.vs{font:400 28px var(--hd);padding-bottom:6px;color:var(--muted)}
.fin{font:400 22px var(--hd);margin:12px 0 4px;text-align:center}
.opp{margin-top:10px}
td small{margin-left:4px;font-size:11px;font-weight:400;color:var(--muted)}
.chip.gs{background:var(--accent);color:#16231A}
.sheet .add .btn{margin:0}
.nav button{font-size:14px;padding:0 2px}
.pr{padding:12px}.pr.off{opacity:.7}
.pr .nm{font-size:16px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pc{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.pc select{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px}
.pc .seg button{min-width:72px}
.add select.in{flex-shrink:0}
.in.no{width:64px;flex-shrink:0;text-align:center}
.nav{gap:2px;padding-left:4px;padding-right:4px}
.nav button{font-size:13px}
.lnk{background:none;border:0;padding:6px 0;text-align:left;min-height:44px;color:var(--ink);cursor:pointer}
.sbc{display:block;margin-top:2px;padding:2px 4px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;line-height:1.3;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<nav class="nav"><button data-tab="att">출석</button><button data-tab="fm">포메이션</button><button data-tab="tm">출전시간</button><button data-tab="hs">기록</button><button data-tab="pl">선수</button><button data-tab="cf">설정</button></nav>
<div id="toast" role="status"></div>
<script>
var FORMS={'4-4-2':[4,4,2],'4-3-3':[4,3,3],'4-2-3-1':[4,2,3,1],'3-5-2':[3,5,2],'3-4-3':[3,4,3],'5-3-2':[5,3,2],'3-3-2':[3,3,2],'3-3-1':[3,3,1],'2-3-2':[2,3,2],'2-3-1':[2,3,1],'2-2-1':[2,2,1]};
var KEY='captain-notes-v1',UI={pick:null,armed:null,text:null,mg:false};
function pad(n){return String(n).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fresh(){return {team:'우리 팀',date:today(),members:[],att:{},qn:4,qmin:20,q:[],tab:'att',cq:0,hist:[],sort:'name',guests:[],sc:[],opp:''}}
function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
var S=Object.assign(fresh(),load()||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3)}
function fmtDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'})}
function slotDefs(f){var L=FORMS[f],n=L.length,out=[{g:'GK',x:50,y:90}];
 L.forEach(function(c,i){var y=n>1?70-i*(56/(n-1)):40,g=i===0?'DF':(i===n-1?'FW':'MF');for(var j=0;j<c;j++)out.push({g:g,x:(j+1)/(c+1)*100,y:y})});return out}
function fixQ(){S.qn=Math.max(2,Math.min(6,S.qn||4));
 while(S.q.length<S.qn)S.q.push({f:S.q.length?S.q[S.q.length-1].f:'4-3-3',s:[]});S.q.length=S.qn;
 S.q.forEach(function(q){if(!FORMS[q.f])q.f='4-3-3';if(!S.v2&&q.f==='4-4-2'&&!q.s.some(Boolean))q.f='4-3-3';var n=slotDefs(q.f).length;q.s=q.s.slice(0,n);while(q.s.length<n)q.s.push(null);q.sub=q.sub||{};Object.keys(q.sub).forEach(function(i){if(!q.s[i]||!q.sub[i])delete q.sub[i]})});S.v2=1;if(!S.v3){S.sort='name';S.v3=1}
 S.sc=S.sc||[];while(S.sc.length<S.qn)S.sc.push({a:0,b:0});S.sc.length=S.qn;if(S.cq>=S.qn)S.cq=0}
function attendees(){return S.members.filter(function(m){return S.att[m.id]==='y'})}
function nameOf(id){var m=S.members.concat(S.guests).find(function(x){return x.id===id});return m?m.name:''}
function isGuest(id){return S.guests.some(function(g){return g.id===id})}
function sumSc(src){var a=0,b=0;(src||S.sc).forEach(function(s){a+=s.a;b+=s.b});return {a:a,b:b}}
function scTxt(r){var s=sumSc(r.sc);return (r.opp?'vs '+esc(r.opp)+' ':'')+s.a+' : '+s.b+' '+(s.a>s.b?'승':s.a<s.b?'패':'무')}
function scoreCard(){var s=S.sc[S.cq],f=sumSc();
 function st(k,l){return '<div><span class="lbl">'+l+'</span><div class="step"><button data-act="sc" data-k="'+k+'" data-d="-1" aria-label="'+l+' 점수 빼기">−</button><b>'+s[k]+'</b><button data-act="sc" data-k="'+k+'" data-d="1" aria-label="'+l+' 점수 더하기">+</button></div></div>'}
 return '<section class="card"><div class="scr">'+st('a','우리')+'<span class="vs">:</span>'+st('b',esc(S.opp||'상대'))+'</div><div class="fin">'+(S.cq+1)+'쿼터 기준, 최종 '+f.a+' : '+f.b+' '+(f.a>f.b?'승':f.a<f.b?'패':'무')+'</div><p class="note" style="text-align:center;margin:0">'+S.sc.map(function(x,i){return (i+1)+'쿼터 '+x.a+':'+x.b}).join(', ')+'</p><input class="in opp" value="'+esc(S.opp)+'" maxlength="20" placeholder="상대팀 이름 (선택)" data-chg="opp" aria-label="상대팀 이름"></section>'}
function cl(m,qm){return Math.max(1,Math.min(+m||1,qm-1))}
function qinfo(q,id,qm){var d=slotDefs(q.f),sb=q.sub||{},i=q.s.indexOf(id);
 if(i>=0){var s=sb[i];return {m:s?cl(s.m,qm):qm,g:d[i].g}}
 for(var k in sb){if(sb[k].id===id)return {m:qm-cl(sb[k].m,qm),g:d[+k].g}}
 return null}
function qids(q){var o={};q.s.forEach(function(id){if(id)o[id]=1});Object.keys(q.sub||{}).forEach(function(k){o[q.sub[k].id]=1});return Object.keys(o)}
function cntQ(id){return S.q.filter(function(q){return qinfo(q,id,S.qmin)}).length}
function minsAll(id){return S.q.reduce(function(a,q){var f=qinfo(q,id,S.qmin);return a+(f?f.m:0)},0)}
function modeTabs(c){return '<div class="qt"><button class="'+(c==='st'?'on':'')+'" data-act="pmode" data-v="st">선발</button><button class="'+(c==='sb'?'on':'')+'" data-act="pmode" data-v="sb">교체 선수</button></div>'}
function subSheet(q,defs,at){var i=UI.pick,sb=q.sub[i],qm=S.qmin,st=q.s[i];
 var h='<div class="shade" data-act="close"></div><div class="sheet" role="dialog"><h3>'+defs[i].g+' 자리 교체</h3>'+modeTabs('sb');
 h+='<p class="note">선발 '+esc(nameOf(st))+'. 교체 시각을 입력하고 투입할 선수를 고르세요.</p>';
 if(sb){var m=cl(sb.m,qm);h+='<p class="note"><b>'+esc(nameOf(sb.id))+'</b> 투입, '+m+'분 교체. '+esc(nameOf(st))+' '+m+'분, '+esc(nameOf(sb.id))+' '+(qm-m)+'분 출전</p><button class="btn ghost" data-act="clearsub">교체 해제</button>'}
 h+='<label class="lbl" for="subMin">교체 시각 (쿼터 시작 후 분, 1~'+(qm-1)+')</label><input id="subMin" class="in" type="number" min="1" max="'+(qm-1)+'" value="'+(sb?cl(sb.m,qm):cl(15,qm))+'">';
 var us={};Object.keys(q.sub).forEach(function(k){us[q.sub[k].id]=1});
 var cand=at.filter(function(p){return q.s.indexOf(p.id)<0&&(!us[p.id]||(sb&&sb.id===p.id))}).sort(byName);
 h+=cand.map(function(p){return '<button class="pick" data-act="setsub" data-id="'+p.id+'"><span>'+esc(p.name)+tag(p)+'</span><em>'+(sb&&sb.id===p.id?'현재 교체 선수':minsAll(p.id)+'분 출전')+'</em></button>'}).join('')||'<p class="note">벤치에 남은 선수가 없어요.</p>';
 return h+'<button class="btn ghost" data-act="close">닫기</button></div>'}
function anyFilled(){return S.q.some(function(q){return q.s.some(Boolean)})}
function dropFromLineups(id){S.q.forEach(function(q){q.sub=q.sub||{};q.s=q.s.map(function(x,i){if(x===id)delete q.sub[i];return x===id?null:x});Object.keys(q.sub).forEach(function(i){if(q.sub[i].id===id)delete q.sub[i]})})}
function cno(v){var n=parseInt(v,10);return isNaN(n)?'':String(Math.max(0,Math.min(99,n)))}
function tag(m){if(m.guest)return '<small>게스트</small>';var p=[];if(m.no)p.push('#'+esc(m.no));if(m.pos!=='ANY')p.push(m.pos);return p.length?'<small>'+p.join(' ')+'</small>':''}
var SORTS=[['name','이름순'],['no','등번호순'],['add','등록순'],['pos','포지션순'],['att','참석 상태순'],['min','누적 출전시간순']],PO={GK:0,DF:1,MF:2,FW:3,ANY:4},AO={y:0,m:1,n:2};
function sortSel(){return '<div class="sort"><span>명단 정렬</span><select data-chg="sort" aria-label="명단 정렬">'+SORTS.map(function(s){return '<option value="'+s[0]+'"'+(S.sort===s[0]?' selected':'')+'>'+s[1]+'</option>'}).join('')+'</select></div>'}
function byName(a,b){return a.name.localeCompare(b.name,'ko')}
function blank(n){return {y:0,n:0,min:0,GK:0,DF:0,MF:0,FW:0,name:n}}
function totals(){var T={};
 S.hist.forEach(function(r){
  Object.keys(r.att).forEach(function(id){var t=T[id]=T[id]||blank(r.names[id]);if(r.att[id]==='y')t.y++;else if(r.att[id]==='n')t.n++});

function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show')},1800)}
function lineupText(){var fs=sumSc(),L=[S.team+' '+fmtDate(S.date)+(S.opp?' vs '+S.opp:'')+' 최종 '+fs.a+' : '+fs.b];
 S.q.forEach(function(q,qi){var defs=slotDefs(q.f);L.push('',(qi+1)+'쿼터 '+q.f+(S.sc[qi]?' ('+S.sc[qi].a+' : '+S.sc[qi].b+')':''));
  ['GK','DF','MF','FW'].forEach(function(g){var n=[];defs.forEach(function(d,i){if(d.g===g&&q.s[i])n.push(nameOf(q.s[i])+(isGuest(q.s[i])?'(게스트)':''))});if(n.length)L.push(g+' '+n.join(', '))});
  Object.keys(q.sub||{}).forEach(function(k){var sb=q.sub[k];L.push('교체 '+cl(sb.m,S.qmin)+'분 '+nameOf(q.s[k])+' → '+nameOf(sb.id))});var b=attendees().filter(function(m){return q.s.indexOf(m.id)<0}).map(function(m){return m.name});if(b.length)L.push('벤치 '+b.join(', '))});
 return L.join('\n')}
function copyText(t){return new Promise(function(res){
 function fb(){try{var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();var ok=document.execCommand('copy');a.remove();res(ok)}catch(e){res(false)}}
 try{navigator.clipboard.writeText(t).then(function(){res(true)},fb)}catch(e){fb()}})}

function autoAssign(){var ppl=attendees(),cnt={},len=ppl.length;ppl.forEach(function(p){cnt[p.id]=0});
 S.q.forEach(function(q,qi){var defs=slotDefs(q.f),n=defs.length,chosen=[],keep={};q.s.forEach(function(id,i){if(id&&isGuest(id))keep[i]=id});
  var order=ppl.map(function(p,i){return {p:p,k:(i+qi*3)%Math.max(len,1)}}).sort(function(a,b){return cnt[a.p.id]-cnt[b.p.id]||a.k-b.k}).map(function(o){return o.p});
  var gk=order.filter(function(p){return p.pos==='GK'})[0];
  if(gk){chosen.push(gk);order=order.filter(function(p){return p!==gk})}
  chosen=chosen.concat(order).slice(0,n-Object.keys(keep).length);
  var res=[];for(var i=0;i<n;i++)res.push(keep[i]||null);
  var left=chosen.slice();
  ['GK','FW','DF','MF'].forEach(function(g){defs.forEach(function(d,i){if(d.g!==g||res[i])return;var k=left.findIndex(function(p){return p.pos===g});if(k>=0){res[i]=left[k].id;left.splice(k,1)}})});
  defs.forEach(function(d,i){if(!res[i]&&left.length)res[i]=left.shift().id});
  chosen.forEach(function(p){cnt[p.id]++});q.s=res;q.sub={}})}

document.addEventListener('click',function(e){
 var t=e.target.closest('[data-act],[data-tab]');if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;UI.pick=null;save();render();window.scrollTo(0,0);return}
 var a=t.dataset.act,id=t.dataset.id;
 if(a==='att'){S.att[id]=t.dataset.v;if(t.dataset.v!=='y')dropFromLineups(id)}
 else if(a==='add'){var inp=document.getElementById('newName'),nm=inp.value.trim();if(!nm)return;var ps=document.getElementById('newPos'),pn=document.getElementById('newNo');S.members.push({id:uid(),name:nm,pos:ps?ps.value:'ANY',no:cno(pn?pn.value:''),act:true});save();render();document.getElementById('newName').focus();return}
 else if(a==='sample'){[['김민준','GK'],['이서준','DF'],['박도윤','DF'],['최하준','DF'],['정지호','DF'],['강시우','MF'],['조은우','MF'],['윤지훈','MF'],['장현우','MF'],['임준서','FW'],['한유찬','FW'],['오태민','ANY'],['서건우','ANY'],['신재원','ANY']].forEach(function(p){S.members.push({id:uid(),name:p[0],pos:p[1]})})}
 else if(a==='del'){if(!twice('del'+id)){render();return}S.members=S.members.filter(function(m){return m.id!==id});delete S.att[id];dropFromLineups(id)}
 else if(a==='newmatch'){if(!twice('new')){render();return}S.att={};S.guests=[];S.sc=[];S.opp='';S.date=today();S.cq=0;S.q.forEach(function(q){q.s=q.s.map(function(){return null});q.sub={}})}
 else if(a==='q'){S.cq=+t.dataset.i}
 else if(a==='slot'){UI.pick=+t.dataset.i;UI.pm='st';render();return}
 else if(a==='assign'){var q=S.q[S.cq],i=UI.pick,prev=q.s[i],j=q.s.indexOf(id);q.sub=q.sub||{};delete q.sub[i];Object.keys(q.sub).forEach(function(k){if(q.sub[k].id===id)delete q.sub[k]});if(j>=0){q.s[j]=prev||null;delete q.sub[j]}q.s[i]=id;UI.pick=null}
 else if(a==='clear'){S.q[S.cq].s[UI.pick]=null;delete S.q[S.cq].sub[UI.pick];UI.pick=null}
 else if(a==='close'){UI.pick=null;UI.text=null;render();return}
 else if(a==='hv'){UI.hv=t.dataset.v}
 else if(a==='pf'){UI.pf=t.dataset.v}
 else if(a==='exp'){var etx=JSON.stringify({app:'captain-notes',v:1,data:S});copyText(etx).then(function(ok){if(ok)toast('백업 코드를 복사했어요');else{UI.text=etx;render()}});return}
 else if(a==='imp'){var ra=(document.getElementById('impTxt')||{}).value||UI.imp||'',dd=null;try{var oo=JSON.parse(ra.trim());if(oo&&oo.app==='captain-notes')dd=oo.data}catch(err){}if(!dd||!Array.isArray(dd.members)||!Array.isArray(dd.hist)){toast('백업 코드를 확인해 주세요');return}if(!twice('imp')){render();return}UI.armed=null;S=Object.assign(fresh(),dd);S.tab='cf';UI.imp='';UI.pick=null;toast('백업을 가져왔어요')}
 else if(a==='wipe'){if(!twice('wipe')){render();return}UI.armed=null;S=fresh();S.tab='cf';UI.imp='';toast('모든 데이터를 지웠어요')}
 else if(a==='actv'){var am=S.members.find(function(x){return x.id===id});if(!am)return;if(t.dataset.v==='off'){am.act=false;am.why=am.why||'부상';delete S.att[id];dropFromLineups(id);toast('현재 경기 출석과 배치에서 뺐어요')}else{am.act=true}}
 else if(a==='copyprev'){var cq=S.q[S.cq],pq=S.q[S.cq-1];if(!pq)return;if(cq.s.some(Boolean)&&!twice('cp')){render();return}UI.armed=null;cq.f=pq.f;cq.s=pq.s.slice();cq.sub={};toast(S.cq+'쿼터 배치를 가져왔어요')}
 else if(a==='pmode'){if(t.dataset.v==='sb'&&!S.q[S.cq].s[UI.pick]){toast('선발 선수를 먼저 배치해 주세요');return}UI.pm=t.dataset.v}
 else if(a==='setsub'){var mi=document.getElementById('subMin'),mv=cl(mi?mi.value:15,S.qmin);S.q[S.cq].sub=S.q[S.cq].sub||{};S.q[S.cq].sub[UI.pick]={id:id,m:mv};UI.pick=null;toast('교체를 등록했어요')}
 else if(a==='clearsub'){delete S.q[S.cq].sub[UI.pick];UI.pick=null}
 else if(a==='sc'){var sc=S.sc[S.cq],k=t.dataset.k;sc[k]=Math.max(0,Math.min(99,sc[k]+(+t.dataset.d)))}
 else if(a==='addguest'){var gi=document.getElementById(t.dataset.in),gn=gi?gi.value.trim():'';if(!gn)return;var gg={id:'g'+uid(),name:gn,pos:'ANY',guest:true};S.guests.push(gg);if(UI.pick!=null){S.q[S.cq].s[UI.pick]=gg.id;delete S.q[S.cq].sub[UI.pick];UI.pick=null}}
 else if(a==='delguest'){if(!twice('dg'+id)){render();return}S.guests=S.guests.filter(function(g){return g.id!==id});dropFromLineups(id)}
 else if(a==='savematch'){var ex=S.hist.some(function(r){return r.date===S.date});if(ex&&!twice('save')){render();return}UI.armed=null;saveMatch();toast(ex?'같은 날짜 기록을 덮어썼어요':'경기를 저장했어요')}
 else if(a==='delrec'){if(!twice('dr'+id)){render();return}S.hist=S.hist.filter(function(r){return r.date!==id})}
 else if(a==='loadrec'){switchDate(id);S.tab='att'}
 else if(a==='auto'){if(anyFilled()&&!twice('auto')){render();return}if(!attendees().length){toast('참석자를 먼저 체크해 주세요');return}UI.armed=null;autoAssign();toast('자동 배치를 마쳤어요')}
 else if(a==='copy'){var txt=lineupText();copyText(txt).then(function(ok){if(ok)toast('라인업을 복사했어요');else{UI.text=txt;render()}});return}
 save();render()});
document.addEventListener('change',function(e){var t=e.target,c=t.dataset.chg;if(!c)return;
 if(c==='team')S.team=t.value.trim()||'우리 팀';
 else if(c==='date')switchDate(t.value||today());
 else if(c==='pos'){var m=S.members.find(function(x){return x.id===t.dataset.id});if(m)m.pos=t.value}
 else if(c==='form'){S.q[S.cq].f=t.value;S.q[S.cq].sub={}}
 else if(c==='qn')S.qn=+t.value;
 else if(c==='qmin')S.qmin=Math.max(5,Math.min(45,+t.value||20));
 else if(c==='sort')S.sort=t.value;
 else if(c==='opp')S.opp=t.value.trim();
 else if(c==='no'){var nmm=S.members.find(function(x){return x.id===t.dataset.id});if(nmm)nmm.no=cno(t.value)}
 else if(c==='why'){var wm=S.members.find(function(x){return x.id===t.dataset.id});if(wm)wm.why=t.value}
 save();render()});
document.addEventListener('keydown',function(e){var idm=e.target.id;if((idm==='newName'||idm==='gName'||idm==='gName2')&&e.key==='Enter'){e.preventDefault();var b=document.querySelector('[data-in="'+idm+'"]')||document.querySelector('[data-act="add"]');if(b)b.click()}});
document.addEventListener('input',function(e){if(e.target.id==='impTxt')UI.imp=e.target.value});
document.addEventListener('toggle',function(e){if(e.target.matches&&e.target.matches('details[data-mg]'))UI.mg=e.target.open},true);
render();
</script>
